syscfg.defs:
    EVENTQ_TASK_PRIO:
        description: 'Priority of the blink task.'
        type: task_priority
        value: 10
    EVENTQ_TASK_STACK_SIZE:
        description: 'Stack size of the blink task (os_stack_t units).'
        value: 256
    EVENTQ_TASK_APP_SYSINIT_STAGE:
        description: >
            Sysinit stage of application init function.  Runs before
            STATIC_TASK_SYSINIT_STAGE to show that events can be put on
            the queue before its task is started.
        value: 500
