# USBD_VID, USBD_PID, USBD_VENDOR_STRING and USBD_PRODUCT_STRING are left
# to the target.  Ethernet is enabled by the target (ETH_0: 1) on boards
# that have it.
syscfg.vals:
    CONSOLE_IMPLEMENTATION: full
    LOG_IMPLEMENTATION: full
    SHELL_TASK: 1

    USBD_STD_DESCRIPTORS: 1
    # Network function uses Interface Association Descriptor.
    USBD_COMPOSITE_DEVICE: 1
    USBD_NET: NCM
    USBD_STACK_SIZE: 256

    # lwIP heap is shared between tasks.
    BASELIBC_THREAD_SAFE_HEAP_ALLOCATION: 1
    # Ethernet DHCP client, DHCP server on USB, inet_def_service (3)
    # and DNS client.
    LWIP_NUM_UDP_PCB: 8

    # Received TCP data is copied to msys mbufs.  lwIP can deliver whole
    # receive window (TCP_WND, 3 * MSS) at once, msys must be able to hold
    # it or received data can't be passed to socket.
    MSYS_1_BLOCK_COUNT: 32
