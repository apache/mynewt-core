pkg.name: hw/mcu/microchip/pic32mz
pkg.description: MCU definition for Microchip PIC32MZ microcontrollers.
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "http://mynewt.apache.org/"
pkg.keywords:
    - pic32
    - pic32mz

pkg.link_tables:
    - pic32_isr_table

pkg.deps:
    - "@apache-mynewt-core/hw/hal"
    - "@apache-mynewt-core/hw/drivers/uart/uart_hal"
    - "@apache-mynewt-core/mgmt/image_header"

pkg.deps.ETH_0:
    - "@apache-mynewt-core/hw/drivers/lwip/pic32_eth"

# Configuration words are only written by builds that own boot flash
pkg.deps.'(BOOT_LOADER || MCU_NO_BOOTLOADER_BUILD)':
    - "@apache-mynewt-core/hw/mcu/microchip/pic32mz/devcfg"

# Flash device is only referenced from hal_flash_devs link table
pkg.whole_archive: true
