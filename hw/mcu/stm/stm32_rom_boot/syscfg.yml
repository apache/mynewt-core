syscfg.defs:
    STM32_ROM_BOOT_PIN:
        description: >
            Pin checked at startup, when it is in active state STM32
            system memory bootloader is started. -1 to disable.
        value: -1
    STM32_ROM_BOOT_PIN_PULL:
        description: Pull applied to STM32_ROM_BOOT_PIN.
        value: HAL_GPIO_PULL_NONE
    STM32_ROM_BOOT_PIN_VALUE:
        description: Active state of STM32_ROM_BOOT_PIN (0 or 1).
        value: 0
    STM32_ROM_BOOT_RESET_COUNT:
        description: >
            Number of consecutive resets with reset pin needed to start
            system memory bootloader, 0 to disable. Useful for boards
            without user button.
        value: 0
    STM32_ROM_BOOT_RESET_COUNT_NVREG:
        description: >
            Non-volatile register (RTC backup register) used to count
            reset pin presses. Required when STM32_ROM_BOOT_RESET_COUNT
            is not 0.
        value: -1
    STM32_ROM_BOOT_RESET_WINDOW_MS:
        description: >
            Time after reset pin reset during which next reset pin press
            is counted as consecutive. Startup is delayed by this time
            after each reset pin reset.
        value: 500
    STM32_ROM_BOOT_SYSINIT_STAGE:
        description: >
            Sysinit stage at which pin and reset count are checked.
        value: 1

syscfg.restrictions:
    - '(STM32_ROM_BOOT_RESET_COUNT == 0) || (STM32_ROM_BOOT_RESET_COUNT_NVREG >= 0)'
