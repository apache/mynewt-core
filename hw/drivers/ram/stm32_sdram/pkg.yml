pkg.name: hw/drivers/ram/stm32_sdram
pkg.description: External SDRAM on STM32 FMC (F4, F7, H7).
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "http://mynewt.apache.org/"
pkg.keywords:
    - stm32
    - sdram
    - fmc

pkg.deps:
    - "@apache-mynewt-core/hw/hal"
    - "@apache-mynewt-core/hw/cmsis-core"

# Shell module in stm32_sdram_cli.c is only referenced from link table
pkg.whole_archive: true

pkg.source_files:
    - src/stm32_sdram.c
    - src/stm32_sdram_chips.c

pkg.source_files.STM32_SDRAM_CLI:
    - src/stm32_sdram_cli.c

pkg.deps.STM32_SDRAM_CLI:
    - "@apache-mynewt-core/sys/shell"

pkg.init:
    stm32_sdram_init: 'MYNEWT_VAL(STM32_SDRAM_SYSINIT_STAGE)'
