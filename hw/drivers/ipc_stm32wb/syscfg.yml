syscfg.defs:
    IPC_STM32WB:
        description: >
            Set when CPU2 mailbox driver is present. Can be used by BSP to
            enable clocks required by CPU2.
        value: 1
    IPC_STM32WB_SYSINIT_STAGE:
        description: >
            Sysinit stage for IPC driver. CPU2 is booted here, waiting for
            it to be ready is done later by mailbox users.
        value: 10
    IPC_STM32WB_EVT_POOL_COUNT:
        description: >
            Number of event buffers given to CPU2 for events and ACL data
            sent to CPU1. Each takes 268 bytes of shared SRAM2.
        value: 5
    IPC_STM32WB_SYS_CMD_TIMEOUT_MS:
        description: Time to wait for response to system command.
        value: 1000
