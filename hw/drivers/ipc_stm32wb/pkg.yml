pkg.name: hw/drivers/ipc_stm32wb
pkg.description: >
    IPCC and shared memory mailbox driver for communication with
    STM32WB wireless coprocessor (CPU2).
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "http://mynewt.apache.org/"
pkg.keywords:
    - ipc
    - ipcc
    - stm32wb

pkg.deps:
    - "@apache-mynewt-core/hw/mcu/stm/stm32wbxx"
    - "@apache-mynewt-core/kernel/os"

pkg.init:
    ipc_stm32wb_init: 'MYNEWT_VAL(IPC_STM32WB_SYSINIT_STAGE)'
