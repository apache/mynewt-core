syscfg.defs:
    SPI1_RX_DMA:
        description: >
            DMA channel to use for SPI1 RX.
            DMA (GPDMA) number can be 1 or 2, channel can be 0-7.
        value: DMA1_channel0_spi1_rx
    SPI1_TX_DMA:
        description: >
            DMA channel to use for SPI1 TX.
            DMA (GPDMA) number can be 1 or 2, channel can be 0-7.
        value: DMA1_channel1_spi1_tx
    SPI2_RX_DMA:
        description: >
