syscfg.defs:
    MSC_FAT_VIEW_README: 1
    MSC_FAT_VIEW_DEFAULT_README_HEADER:
        description: >
            If set to 1, README.TXT starts with default header line
            "This device runs <MSC_FAT_VIEW_DEFAULT_README_APP_NAME> on <BSP_NAME>".
            Set to 0 to provide own header with README_TEXT(00, "...").
        value: 1
    MSC_FAT_VIEW_DEFAULT_README_VERSION:
        description: >
            If set to 1, README.TXT will have application version number.
        value: 1
    MSC_FAT_VIEW_DEFAULT_README_APP_NAME:
        description: >
            Application name that will be put in default README.TXT.
        value: MYNEWT_VAL(APP_NAME)
    MSC_FAT_VIEW_DEFAULT_README_INCLUDE_HASHES:
        description: >
            Add git hashes into README.TXT.
        value: 1
