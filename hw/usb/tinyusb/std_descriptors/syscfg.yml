syscfg.defs:
    USBD_STRING_DESCRIPTOR_MAX_LENGTH:
        description: Maximum length of string descriptor in characters
        value: 31
    USBD_EP0_SIZE:
        description: >
            Endpoint 0 size
        value: 64
    USBD_VID:
        description: Vendor ID
        value:
        restrictions:
            - $notnull
    USBD_PID:
        description: Product ID
        value:
        restrictions:
            - $notnull
    USBD_PRODUCT_RELEASE_NUMBER:
        description: Product release number needed for USB descriptor
        value: 0x100
    USBD_CONFIGURATION_MAX_POWER:
        description: >
            Maximum power consumption of the USB device from the bus in this specific
            configuration when the device is fully operational. Expressed in 1 mA units.
            Value will be rounded down to next even number, specifying 101 is equivalent
            to setting it to 100.
        value: 100
    USBD_CONFIGURATION_SELF_POWERED:
        description: >
            Set to 1 when produce is self powered USB device.
        value: 0
    USBD_CONFIGURATION_REMOTE_WAKEUP:
        description: >
            Set to 1 when if USB remote wakeup is supported.
        value: 0
    USBD_LANGID:
        description: Language ID as specified by usb.org
        value: 0x0409
    USBD_VENDOR_STRING:
        description: Manufacturer identification string
        value: '"Vendor string"'
    USBD_PRODUCT_STRING:
        description: Device friendly name
        value: '"Dev device"'
    USBD_COMPOSITE_DEVICE:
        description: >
            When set to 1 device descriptor will have values assigned to
            composite device. Device class = 0xFE, subclasss = 2,
            protocol = 1.
        value: 0
    USBD_DEVICE_CLASS:
        description: >
            Device class that will be reported in device descriptors.
            If 0 (preferred) class is specified in interface only.
            Can be 0xFF for vendor specific.
        value: 0
    USBD_DEVICE_SUBCLASS:
        description: >
            Device sub class that will be reported in device descriptors.
            If USBD_DEVICE_CLASS is 0 this also has to be 0.
        value: 0
    USBD_DEVICE_PROTOCOL:
        description: >
            Device class protocol that will be reported in device descriptors.
        value: 0
    USBD_CDC:
        description: Enable CDC device function in TinyUSB stack (other then console or hci).
        value:
    USBD_CDC_CONSOLE:
        description: Enable CDC device function for console in TinyUSB stack.
        value:
    USBD_HID:
        description: Enable HID device function in TinyUSB stack.
        value:
    USBD_MSC:
        description: Enable MSC device function in TinyUSB stack.
        value:
    USBD_BTH:
        description: Enable BT HCI device function in TinyUSB stack.
        value:
    USBD_DFU:
        description: >
            Enable DFU interface in TinyUSB.  This adds USB descriptor to
            USB configuration.  It does not add TinyUSB callbacks implementation,
            if standard implementation exposing SLOT1 is required USB_DFU_STD can
            be additionally specified.
        value:
    USBD_DFU_RUNTIME:
        description: >
            Enable DFU_RUNTIME interface in TinyUSB.  This adds USB descriptor to
            USB configuration.  It does not add TinyUSB callbacks implementation.
        value:
    USBD_DFU_STD:
        description: >
            Add Mynewt standard DFU interface implementation.
            It will include hw/tinyusb/dfu package with mynewt standard
            DFU implementation.
        value: 0

    USBD_CDC_DATA_OUT_EP:
        description: CDC data out endpoint number
        value:
    USBD_CDC_DATA_IN_EP:
        description: CDC data in endpoint number
        value:
    USBD_CDC_DATA_EP_SIZE:
        description: CDC data endpoint size
        value:
    USBD_CDC_NOTIFY_EP:
        description: CDC notify endpoint number
        value:
    USBD_CDC_NOTIFY_EP_SIZE:
        description: CDC notify endpoint size
        value:
    USBD_CDC_RX_BUFSIZE:
        description: CDC endpoint OUT FIFO size
        value:
    USBD_CDC_TX_BUFSIZE:
        description: CDC endpoint IN FIFO size
        value:

    USBD_CDC_CONSOLE_DATA_OUT_EP:
        description: CDC CONSOLE data out endpoint number
        value:
    USBD_CDC_CONSOLE_DATA_IN_EP:
        description: CDC CONSOLE data out endpoint number
        value:
    USBD_CDC_CONSOLE_NOTIFY_EP:
        description: CDC CONSOLE notify endpoint number
        value:

    USBD_CDC_DESCRIPTOR_STRING:
        description: String for CDC interface
        value:

    USBD_MSC_DESCRIPTOR_STRING:
        description: String for MSC interface
        value:

    USBD_HID_DESCRIPTOR_STRING:
        description: String for HID interface
        value:

    USBD_BTH_DESCRIPTOR_STRING:
        description: String for BT descriptor
        value:

    USBD_HID_REPORT_EP:
        description: HID report endpoint number
        value:
    USBD_HID_REPORT_EP_SIZE:
        description: HID report endpoint size
        value:
    USBD_HID_REPORT_EP_INTERVAL:
        description: HID report endpoint interval
        value:

    USBD_HID_REPORT_ID_KEYBOARD:
        description: HID keyboard report ID. 0 Or empty to ommit the report.
        value:
    USBD_HID_CAPS_LOCK_LED_PIN:
        description: Caps Lock LED
        value: -1
    USBD_HID_CAPS_LOCK_LED_ON_VALUE:
        description: Value to set to pin to turn led on
        value: 0
    USBD_HID_NUM_LOCK_LED_PIN:
        description: Num Lock LED
        value: -1
    USBD_HID_NUM_LOCK_LED_ON_VALUE:
        description: Value to set to pin to turn led on
        value: 0
    USBD_HID_REPORT_ID_MOUSE:
        description: HID keyboard report ID. 0 Or empty to ommit the report.
        value:

    USBD_BTH_EVENT_EP:
        description: BTH event endpoint number
        value:
    USBD_BTH_EVENT_EP_SIZE:
        description: BTH event endpoint size
        value:
    USBD_BTH_EVENT_EP_INTERVAL:
        description: BTH event endpoint interval
        value: 1
    USBD_BTH_DATA_IN_EP:
        description: BTH data in endpoint number
        value:
    USBD_BTH_DATA_OUT_EP:
        description: BTH data out endpoint number
        value:
    USBD_BTH_DATA_EP_SIZE:
        description: BTH data endpoints size
        value:

    USBD_MSC_DATA_IN_EP:
        description: MSC data in endpoint number
        value:
    USBD_MSC_DATA_OUT_EP:
        description: MSC data out endpoint number
        value:
    USBD_MSC_EP_BUFSIZE:
        description: MSC data endpoint buffer size
        value:

    USBD_AUDIO:
        description: >
            Enable USB Audio Class 2.0 function in TinyUSB stack.
            IN - microphone (device sends audio to host),
            OUT - speaker (host sends audio to device),
            IN_OUT - headset (both directions, single clock source),
            NONE - no audio function.
            This adds descriptors to USB configuration, application has to
            implement TinyUSB audio class callbacks (tud_audio_*_cb).
            Entity IDs used in descriptors are defined in usbd_audio_desc.h.
        value: NONE
        choices:
            - NONE
            - IN
            - OUT
            - IN_OUT
    USBD_AUDIO_DESCRIPTOR_STRING:
        description: String for Audio Control interface
        value:
    USBD_AUDIO_SAMPLE_RATE:
        description: >
            Audio sampling frequency in Hz, same for microphone and speaker.
        value: 48000
    USBD_AUDIO_SAMPLE_SIZE:
        description: >
            Number of valid bits in each audio sample (bit resolution).
        value: 16
        range: 8..32
    USBD_AUDIO_BYTES_PER_SAMPLE:
        description: >
            Number of bytes each sample occupies in USB packet (subslot size,
            1-4).  Leave empty to use smallest size that fits
            USBD_AUDIO_SAMPLE_SIZE.  Set to 4 for 24 bit samples in 32 bit
            slots.
        value:
    USBD_AUDIO_IN_CHANNELS:
        description: >
            Number of microphone (IN) channels.  Values 1 and 2 are reported
            to host as mono and stereo, other values as channels without
            spatial location.
        value: 1
        range: 1..32
    USBD_AUDIO_OUT_CHANNELS:
        description: >
            Number of speaker (OUT) channels.  Values 1 and 2 are reported
            to host as mono and stereo, other values as channels without
            spatial location.
        value: 2
        range: 1..32
    USBD_AUDIO_IN_TERMINAL_TYPE:
        description: >
            Terminal type of microphone input terminal, as AUDIO_TERM_TYPE_IN_*
            constant from TinyUSB audio.h or numeric value from USB Audio
            Terminal Types specification (0x0201 - generic microphone,
            0x0202 - desktop, 0x0203 - personal, 0x0204 - omni-directional,
            0x0205 - microphone array).
            Empty for AUDIO_TERM_TYPE_IN_GENERIC_MIC.
        value:
    USBD_AUDIO_OUT_TERMINAL_TYPE:
        description: >
            Terminal type of speaker output terminal, as AUDIO_TERM_TYPE_OUT_*
            constant from TinyUSB audio.h or numeric value from USB Audio
            Terminal Types specification (0x0301 - generic speaker,
            0x0302 - headphones, 0x0304 - desktop speaker, 0x0305 - room
            speaker, 0x0306 - communication speaker, 0x0307 - LFE speaker).
            Empty for AUDIO_TERM_TYPE_OUT_HEADPHONES when USBD_AUDIO is IN_OUT
            and AUDIO_TERM_TYPE_OUT_DESKTOP_SPEAKER otherwise.
        value:
    USBD_AUDIO_VOLUME_CONTROL:
        description: >
            Add feature unit with mute and volume controls (master and per
            channel) to microphone and speaker path.  Application has to
            handle requests for USBD_AUDIO_ENTITY_SPK_FEATURE_UNIT and
            USBD_AUDIO_ENTITY_MIC_FEATURE_UNIT.  Supports up to 8 channels.
        value: 1
    USBD_AUDIO_FEEDBACK:
        description: >
            Add feedback endpoint to speaker path.  Speaker endpoint is then
            asynchronous and device reports its actual sampling rate to host
            (see tud_audio_feedback_params_cb()).  Without feedback endpoint
            speaker endpoint is adaptive and device has to follow host's rate.
        value: 0
    USBD_AUDIO_OUT_EP:
        description: >
            Speaker (OUT) isochronous endpoint number.
            Empty for default: 8 on nRF5x (only isochronous endpoint),
            1 otherwise.
        value:
    USBD_AUDIO_IN_EP:
        description: >
            Microphone (IN) isochronous endpoint number.
            Empty for default: 8 on nRF5x (only isochronous endpoint),
            1 otherwise.
        value:
    USBD_AUDIO_FEEDBACK_EP:
        description: >
            Feedback (IN) isochronous endpoint number, must differ from
            USBD_AUDIO_IN_EP when both are used.
            Empty for default: 8 on nRF5x, 2 otherwise.
        value:
    USBD_AUDIO_INT_EP:
        description: >
            Audio Control interrupt (IN) endpoint number used to notify host
            about control changes.  Empty for no interrupt endpoint.
        value:
    USBD_AUDIO_IN_BUFFER_PACKETS:
        description: >
            Size of TinyUSB software FIFO for microphone data in 1 ms
            packets.  TinyUSB flow control for IN endpoint requires at least 4.
        value: 4
    USBD_AUDIO_OUT_BUFFER_PACKETS:
        description: >
            Size of TinyUSB software FIFO for speaker data in 1 ms packets.
        value: 4

    USBD_WINDOWS_COMP_ID:
        description: >
            Add Windows compatibility descriptor.
        value: 0
    USBD_WINDOWS_COMP_ID_STRING:
        description: >
            Windows Compatibility ID String.
        value: '"WINUSB"'
    USBD_WINDOWS_COMP_INTERFACE:
        description: >
            Interface number associated with USBD_WINDOWS_COMP_ID.
        value: 0

    CFG_TUSB_DEBUG:
        description: >
            When set to value > 0 enables TinyUSB logs and redirects them to Mynewt console.
            It activates logs created by TU_LOG1, TU_LOG2, TU_LOG3
        range: 0..3
        value: 0

syscfg.restrictions:
    - '(CFG_TUSB_DEBUG == 0) || (USBD_STACK_SIZE >= 400)'

syscfg.vals.USBD_COMPOSITE_DEVICE:
    USBD_DEVICE_CLASS: TUSB_CLASS_MISC
    USBD_DEVICE_SUBCLASS: MISC_SUBCLASS_COMMON
    USBD_DEVICE_PROTOCOL: MISC_PROTOCOL_IAD
