pkg.name: hw/usb/tinyusb/tinyusb_sdk/networking
pkg.description: >
    TinyUSB networking library: RNDIS message handling needed by TinyUSB
    CDC-ECM/RNDIS device driver (CFG_TUD_ECM_RNDIS).
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "https://mynewt.apache.org/"
pkg.keywords:
    - usb
    - rndis

pkg.type: sdk

pkg.deps:
    - "@apache-mynewt-core/hw/usb/tinyusb/tinyusb_sdk"
    # rndis_reports.c includes lwIP netif/ethernet.h (needs lwipopts.h)
    - "@apache-mynewt-core/net/ip/lwip_mn"

pkg.include_dirs:
    - "@tinyusb/lib/networking"

pkg.source_files:
    - "@tinyusb/lib/networking/rndis_reports.c"
