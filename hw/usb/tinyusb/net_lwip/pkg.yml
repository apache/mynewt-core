pkg.name: hw/usb/tinyusb/net_lwip
pkg.description: >
    lwIP network interface for TinyUSB network function (CDC-NCM,
    CDC-ECM or RNDIS selected with USBD_NET).
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "https://mynewt.apache.org/"
pkg.keywords:
    - usb
    - tinyusb
    - lwip
    - ncm
    - ecm
    - rndis

# Package provides TinyUSB callbacks that override weak defaults
# (tud_event_hook_cb, tud_network_set_packet_filter_cb).
pkg.whole_archive: true

pkg.deps:
    - "@apache-mynewt-core/kernel/os"
    - "@apache-mynewt-core/hw/hal"
    - "@apache-mynewt-core/net/ip/lwip_mn"
    - "@apache-mynewt-core/hw/usb/tinyusb"
    - "@apache-mynewt-core/hw/usb/tinyusb/std_descriptors"

pkg.init:
    usb_net_lwip_init: 'MYNEWT_VAL(USBD_NET_SYSINIT_STAGE)'
