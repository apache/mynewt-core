syscfg.defs:
    USBD_NET_IP_ADDR:
        description: >
            IPv4 address of the device on USB network interface.
        value: '"192.168.7.1"'
    USBD_NET_NETMASK:
        description: >
            IPv4 network mask of USB network interface.
        value: '"255.255.255.0"'
    USBD_NET_MAC_ADDR:
        description: >
            Device side MAC address as 6 comma separated bytes, e.g.
            0x02,0x00,0x00,0x00,0x00,0x01.  Host side uses the same address
            with last byte xor 1.  Empty: locally administered address
            derived from hal_bsp_hw_id().
        value:
    USBD_NET_TX_QUEUE_LEN:
        description: >
            Number of outgoing frames lwIP can queue for USB transmission.
        value: 8
    USBD_NET_SYSINIT_STAGE:
        description: >
            Sysinit stage of USB network interface.  Must be after lwIP
            (IP_SYSINIT_STAGE) and before USB stack start
            (USBD_SYSINIT_STAGE) since host MAC address is reported in USB
            descriptors.
        value: 250

syscfg.vals:
    USBD_NET: NCM
    USBD_NET_DESCRIPTOR_STRING: '"Mynewt network"'

syscfg.restrictions:
    - '(USBD_NET == "NCM") || (USBD_NET == "ECM") || (USBD_NET == "RNDIS")'
    # Network function uses Interface Association Descriptor
    - 'USBD_COMPOSITE_DEVICE'
    - 'USBD_NET_SYSINIT_STAGE > IP_SYSINIT_STAGE'
    - 'USBD_NET_SYSINIT_STAGE < USBD_SYSINIT_STAGE'
