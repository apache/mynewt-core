bsp.name: "WeAct H503CB"
bsp.url: https://github.com/WeActStudio/WeActStudio.STM32H503CoreBoard
bsp.maker: "WeAct"
bsp.arch: cortex_m33
bsp.compiler: compiler/arm-none-eabi-m33
bsp.linkerscript: autogenerated
bsp.downloadscript: "hw/scripts/download.sh"
bsp.debugscript: "hw/bsp/weact_h503cb/debug.sh"

bsp.flash_map:
    areas:
        # MCUboot bootloader
        FLASH_AREA_BOOTLOADER:
            device: 0
            offset: 0x08000000
            size: 32kB
        # Single application slot
        FLASH_AREA_IMAGE_0:
            device: 0
            offset: 0x08008000
            size: 96kB

bsp.flash_map.'(FLASH_LAYOUT=="no_bootloader")':
    areas:
        FLASH_AREA_IMAGE_0:
            device: 0
            offset: 0x08000000
            size: 128kB

bsp.flash_map.'(FLASH_LAYOUT=="bootloader_and_spiflash_8m")':
    areas:
        # Embedded flash 128kB
        # MCUboot bootloader
        FLASH_AREA_BOOTLOADER:
            device: 0
            offset: 0x08000000
            size: 32kB
        # Single application slot
        FLASH_AREA_IMAGE_0:
            device: 0
            offset: 0x08008000
            size: 96kB
        # External SPI flash, 8MB
        # 64kB reboot log
        FLASH_AREA_REBOOT_LOG:
            user_id: 2
            device: 1
            offset: 0x00000000
            size: 64kB

        FLASH_AREA_NFFS:
            user_id: 1
            device: 1
            offset: 0x00010000
            size: 64kB
        FLASH_AREA_LITTLEFS:
            user_id: 3
            device: 1
            offset: 0x00020000
            size: 128kB

bsp.flash_map.'(FLASH_LAYOUT=="bootloader_and_spiflash_1m")':
    areas:
        # Embedded flash 128kB
        # MCUboot bootloader
        FLASH_AREA_BOOTLOADER:
            device: 0
            offset: 0x08000000
            size: 32kB
        # Single application slot
        FLASH_AREA_IMAGE_0:
            device: 0
            offset: 0x08008000
            size: 96kB
        # External SPI flash, 1MB
        # 64kB reboot log
        FLASH_AREA_REBOOT_LOG:
            user_id: 2
            device: 1
            offset: 0x00000000
            size: 64kB

        FLASH_AREA_NFFS:
            user_id: 1
            device: 1
            offset: 0x00010000
            size: 64kB
        FLASH_AREA_LITTLEFS:
            user_id: 3
            device: 1
            offset: 0x00020000
            size: 128kB

        FLASH_AREA_TEST_LOG:
            user_id: 4
            device: 1
            offset: 0x0A0000
            size: 384kB
