# HiFive1 (rev A, FE310-G000) with on-board FT2232H.
# Requires OpenOCD 0.11 or newer (mainline has RISC-V support).
# On Windows, FT2232H interface 0 must use the WinUSB driver (Zadig);
# interface 1 stays on the FTDI VCP driver and provides the UART.

adapter driver ftdi
adapter speed 10000
transport select jtag

ftdi device_desc "Dual RS232-HS"
ftdi vid_pid 0x0403 0x6010

ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -oe 0x0020 -data 0x0020

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10e31913

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
$_TARGETNAME configure -work-area-phys 0x80000000 -work-area-size 10000 \
    -work-area-backup 1

flash bank onboard_spi_flash fespi 0x20000000 0 0 0 $_TARGETNAME

# The riscv target (debug spec 0.11) does not implement 'reset'.
# Pulse nSRST directly; the FE310 reset stretcher holds reset ~1 s.
# Call after 'init', e.g. -c init -c hifive1_reset -c shutdown.
proc hifive1_reset {} {
    ftdi set_signal nSRST 0
    sleep 100
    ftdi set_signal nSRST z
    sleep 1500
}
