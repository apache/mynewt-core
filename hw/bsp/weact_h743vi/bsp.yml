bsp.name: "WeAct H743VI"
bsp.url: https://github.com/WeActStudio/MiniSTM32H7xx
bsp.maker: "WeAct"
bsp.arch: cortex_m7
bsp.compiler: compiler/arm-none-eabi-m7
bsp.linkerscript: autogenerated
bsp.downloadscript: "hw/scripts/download.sh"
bsp.debugscript: "hw/bsp/weact_h743vi/debug.sh"

bsp.flash_map:
    areas:
        # System areas.
        # Internal flash holds only bootloader and image 0.
        FLASH_AREA_BOOTLOADER:
            device: 0
            offset: 0x08000000
            size: 128kB
        FLASH_AREA_IMAGE_0:
            device: 0
            offset: 0x08020000
            size: 1920kB
        # Image 1 and scratch in external SPI flash (SPI1)
        FLASH_AREA_IMAGE_1:
            device: 2
            offset: 0x00000000
            size: 1920kB
        FLASH_AREA_IMAGE_SCRATCH:
            device: 2
            offset: 0x001E0000
            size: 128kB

        # User areas.
        # External SPI flash (SPI1)
        FLASH_AREA_CONFIG:
            user_id: 1
            device: 2
            offset: 0x00200000
            size: 32kB
        FLASH_AREA_REBOOT_LOG:
            user_id: 2
            device: 2
            offset: 0x00208000
            size: 32kB
        FLASH_AREA_SPI:
            user_id: 3
            device: 2
            offset: 0x00210000
            size: 128kB

        # External QSPI flash
        FLASH_AREA_LITTLEFS:
            user_id: 4
            device: 1
            offset: 0x90000000
            size: 128kB
        FLASH_AREA_FCB:
            user_id: 5
            device: 1
            offset: 0x90020000
            size: 64kB
