name: Post commit check comment
description: >
  Post problems uploaded by commit-check action as single pull request
  comment, updated on following runs and deleted once all commits are
  fine. Must be run from workflow_run triggered by workflow running the
  check, with actions read and pull-requests write permissions. Pull
  request code is not used, results are treated as untrusted input.

inputs:
  token:
    description: Token used to download results and post comment
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download results
      id: download
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: commit-check-results
        path: ${{ runner.temp }}/commit-check-results
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.token }}

    - name: Post comment
      if: steps.download.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/commit_check_comments.py" \
          "$RUNNER_TEMP/commit-check-results"
