name: Post mynewt-format comments
description: >
  Post problems uploaded by mynewt-format-check action as review comments
  on pull request lines that break a rule. Must be run from workflow_run
  triggered by workflow running the check, with actions read and
  pull-requests write permissions. Pull request code is not used, results
  are treated as untrusted input.

inputs:
  token:
    description: Token used to download results and post review
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download results
      id: download
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: mynewt-format-results
        path: ${{ runner.temp }}/mynewt-format-results
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.token }}

    - name: Post review comments
      if: steps.download.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/mynewt_format_comments.py" \
          "$RUNNER_TEMP/mynewt-format-results"
