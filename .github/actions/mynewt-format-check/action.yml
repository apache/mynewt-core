name: Check style with mynewt-format
description: >
  Check lines changed by pull request with mynewt-format from the same
  apache-mynewt-core as this action, with .mynewt-format of that
  apache-mynewt-core and ignore file of checked out repository. Problems are uploaded as mynewt-format-results artifact for
  mynewt-format-comments action. Requires pull request head (not merge
  commit, as review comments use lines of head) checked out with full
  history and issues read permission (for labels). Fails on errors,
  warnings are reported only. With skip label set on pull request errors
  are reported only too.

inputs:
  skip-label:
    description: Pull request label that makes errors not fail the check
    required: false
    default: skip-style-check
  ignore-file:
    description: >
      Files not to check, relative to repository root. Not having one is fine.
    required: false
    default: .mynewt-format-ignore

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    # All Mynewt repositories are checked with options of mynewt-core
    - name: Select options
      shell: bash
      env:
        IGNORE_FILE: ${{ inputs.ignore-file }}
      run: |
        CORE="$GITHUB_ACTION_PATH/../../.."
        ARGS="--config $CORE/.mynewt-format"
        if [ -f "$IGNORE_FILE" ]; then
          ARGS="$ARGS --ignore-file $IGNORE_FILE"
        fi
        echo "MYNEWT_FORMAT=python3 $CORE/tools/mynewt-format.py $ARGS" >> "$GITHUB_ENV"

    # Fork pull requests get read-only token, so problems are handed over
    # to mynewt-format-comments action run from workflow_run. Saved before
    # the check, so that comments are posted when the check fails too.
    - name: Save results for PR comments
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        mkdir -p "$RUNNER_TEMP/mynewt-format-results"
        echo "$PR_NUMBER" > "$RUNNER_TEMP/mynewt-format-results/pr-number"
        $MYNEWT_FORMAT --git-diff "origin/$GITHUB_BASE_REF" --changed-lines \
          --format json > "$RUNNER_TEMP/mynewt-format-results/problems.jsonl" || true

    - name: Upload results for PR comments
      uses: actions/upload-artifact@v7
      with:
        name: mynewt-format-results
        path: ${{ runner.temp }}/mynewt-format-results/
        retention-days: 3

    # Labels are queried instead of taken from event payload, which is
    # not updated when a run is re-run after the label changed
    - name: Check skip label
      id: label
      uses: actions/github-script@v9
      env:
        SKIP_LABEL: ${{ inputs.skip-label }}
      with:
        script: |
          const labels = await github.rest.issues.listLabelsOnIssue({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
          });
          const skip = labels.data.some(l => l.name === process.env.SKIP_LABEL);
          core.setOutput('skip', skip);

    - name: Check style with mynewt-format
      shell: bash
      env:
        SKIP: ${{ steps.label.outputs.skip }}
        SKIP_LABEL: ${{ inputs.skip-label }}
      run: |
        set +e
        ARGS="--git-diff origin/$GITHUB_BASE_REF --changed-lines --no-color"
        # Exit status 1 means errors (warnings alone exit with 0),
        # 2 means usage or configuration error
        $MYNEWT_FORMAT $ARGS
        STATUS=$?
        FIXES=$($MYNEWT_FORMAT $ARGS -d 2>/dev/null)
        if printf '%s\n' "$FIXES" | grep -q '^+++ '; then
          echo ""
          echo "Proposed fixes (apply with 'git apply'):"
          printf '%s\n' "$FIXES"
        fi
        echo ""
        echo "mynewt-format is in apache-mynewt-core (tools/mynewt-format.py);"
        echo "tools/mynewt-format-setup.sh there installs it as a 'mynewt-format' command."
        echo "Review fixes locally: mynewt-format -i --git-diff origin/master"
        echo "Rules: mynewt-format --list-rules (--explain RULE)"
        if [ "$STATUS" -eq 1 ] && [ "$SKIP" = "true" ]; then
          echo "::warning::Ignoring coding style errors because" \
               "'$SKIP_LABEL' label is present."
          exit 0
        fi
        exit $STATUS
