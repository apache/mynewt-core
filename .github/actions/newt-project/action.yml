name: Set up newt project
description: >
  Create newt project for testing current commit. External repositories
  are restored from cache and then upgraded by newt, so only changes
  since cache was created are downloaded. Cache should be saved only by
  one job and only from master branch, since only caches from default
  branch are available to pull requests.

inputs:
  project:
    description: Project file to use (relative to repository root)
    required: false
    default: .github/project.yml
  path:
    description: Directory to create project in
    required: false
    default: build
  save-cache:
    description: Save repositories to cache (master branch only)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Create project
      id: project
      shell: bash
      run: |
        newt new "${{ inputs.path }}"
        cp -f "${{ inputs.project }}" "${{ inputs.path }}/project.yml"
        echo "cache-prefix=newt-repos-${{ runner.os }}-" >> "$GITHUB_OUTPUT"

    - name: Restore repositories from cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}/repos
        key: ${{ steps.project.outputs.cache-prefix }}${{ github.sha }}
        restore-keys: ${{ steps.project.outputs.cache-prefix }}

    # First upgrade uses master version of apache-mynewt-core to get all
    # repositories, then core is switched to tested commit and upgraded
    # again to download dependencies added by tested commit.
    - name: Upgrade repositories
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        newt upgrade --shallow=1
        git -C repos/apache-mynewt-core fetch origin "$GITHUB_SHA"
        sed -i "s/0.0.0/$GITHUB_SHA-commit/g" project.yml
        newt upgrade --shallow=1

    # Cache key is based on external repositories versions only, so new
    # cache is created only when dependencies change and not on every
    # commit to apache-mynewt-core.
    - name: Compute repositories cache key
      id: key
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        hash=$(for d in repos/*/; do
                   [ "$d" = "repos/apache-mynewt-core/" ] && continue
                   echo "$d $(git -C "$d" rev-parse HEAD)"
               done | git hash-object --stdin | cut -c1-16)
        echo "key=${{ steps.project.outputs.cache-prefix }}$hash" >> "$GITHUB_OUTPUT"

    - name: Save repositories to cache
      if: >-
        inputs.save-cache == 'true' && github.ref == 'refs/heads/master' &&
        github.event_name != 'pull_request' &&
        steps.restore.outputs.cache-matched-key != steps.key.outputs.key
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.path }}/repos
        key: ${{ steps.key.outputs.key }}
