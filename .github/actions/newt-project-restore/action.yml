name: Restore newt project
description: >
  Restore newt and newt project prepared by prepare job of the same
  workflow run, so that external repositories are downloaded only once
  per run. Project file is replaced with one provided by job.

inputs:
  project:
    description: Project file to use (relative to repository root)
    required: true
  path:
    description: Directory to restore project to
    required: false
    default: build

runs:
  using: composite
  steps:
    - name: Download project
      uses: actions/download-artifact@v8
      with:
        name: newt-project
        path: ${{ runner.temp }}/newt-project

    - name: Extract project
      shell: bash
      run: |
        mkdir -p "${{ inputs.path }}"
        zstd -d -c "$RUNNER_TEMP/newt-project/newt-project.tar.zst" | tar -x -C "${{ inputs.path }}"
        rm -rf "$RUNNER_TEMP/newt-project"
        mv "${{ inputs.path }}/.newt-bin" "$GITHUB_WORKSPACE/.newt-bin"
        echo "$GITHUB_WORKSPACE/.newt-bin" >> "$GITHUB_PATH"

    # Repositories were upgraded by prepare job for tested commit, so
    # only project file needs to be updated.
    - name: Set up project file
      shell: bash
      run: |
        cp -f "${{ inputs.project }}" "${{ inputs.path }}/project.yml"
        sed -i "s/0.0.0/$GITHUB_SHA-commit/g" "${{ inputs.path }}/project.yml"
        cd "${{ inputs.path }}"
        newt info
