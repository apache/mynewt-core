name: Blinky

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blinky:
    name: Build blinky
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib
      - name: Install GNU sed
        if: matrix.os == 'macos-latest'
        run: |
             brew install gnu-sed
             echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
      - name: Install newt
        uses: ./.github/actions/newt-install
      - name: Set up project
        uses: ./.github/actions/newt-project
        with:
          project: .github/project.yml
      - name: Build Blinky
        shell: bash
        run: |
             cd build
             bash ../.github/test_build_blinky.sh
