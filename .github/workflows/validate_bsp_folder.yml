name: Validate hw/bsp folder

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate_bsp_folder:
    name: Validate hw/bsp folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.12.3
        with:
          release: 15.2.Rel1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pyyaml pydantic

      - name: Validate bsp folder
        run: python .github/scripts/validate_bsp_folder.py

