name: Bootloader (main)

on:
  schedule:
    - cron: 42 0 * * 6

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootloader:
    name: Build bootloader (main)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1 # v1.14.1
        with:
          release: '15.2.Rel1'
      - name: Install Dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib ccache
      - name: Install newt
        uses: ./.github/actions/newt-install
      - name: Set up project
        uses: ./.github/actions/newt-project
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: bootloader-main
      - name: Build bootloader (main branch)
        shell: bash
        run: |
             cd build
             cd repos/mcuboot
             git fetch --depth=1 origin main
             git checkout --detach FETCH_HEAD
             cd ../..
             bash ../.github/test_build_bootloader_main.sh
             newt test @mcuboot/boot/boot_serial
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: bootloader-main

  # Separate job, so that only it has write access to caches
  cache-cleanup:
    name: Remove superseded caches
    needs: bootloader
    if: >-
      !cancelled() && github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - name: Remove superseded caches
        uses: ./.github/actions/cache-cleanup
