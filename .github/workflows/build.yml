name: Build

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds newt once per run for all platforms used by jobs of this
  # workflow, other jobs take newt from artifact uploaded by this job.
  newt:
    name: Build newt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build newt
        id: newt
        uses: ./.github/actions/newt-install
        with:
          platforms: windows/amd64 darwin/arm64
      - name: Upload newt
        uses: actions/upload-artifact@v7
        with:
          name: newt
          path: ${{ steps.newt.outputs.dist }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Downloads external repositories once per run, all Linux jobs use
  # project prepared by this job.
  prepare:
    name: Prepare project
    needs: newt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install newt
        uses: ./.github/actions/newt-install
        with:
          artifact: newt
      - name: Set up project
        uses: ./.github/actions/newt-project
        with:
          save-cache: true
      # Only .git directories of repositories are packed, working trees
      # are checked out by jobs restoring project
      - name: Pack project
        shell: bash
        run: |
             cp -r .newt-bin build/.newt-bin
             cd build
             {
               find . -mindepth 1 -maxdepth 1 ! -name repos
               find repos -mindepth 1 -maxdepth 1 -name '.*'
               find repos -mindepth 2 -maxdepth 2 -name .git
             } | tar -cf - -T - | zstd -T0 -3 -o ../newt-project.tar.zst
             ls -lh ../newt-project.tar.zst
      - name: Upload project
        uses: actions/upload-artifact@v7
        with:
          name: newt-project
          path: newt-project.tar.zst
          compression-level: 0
          retention-days: 1

  blinky:
    name: Build blinky
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install Dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib ccache
      - name: Restore project
        uses: ./.github/actions/newt-project-restore
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: blinky-${{ matrix.shard }}
      - name: Build Blinky
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 2
        run: |
             cd build
             bash ../.github/test_build_blinky.sh
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: blinky-${{ matrix.shard }}

  blinky-other-os:
    name: Build blinky
    needs: newt
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install GNU sed
        if: matrix.os == 'macos-latest'
        run: |
             brew install gnu-sed
             echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
      - name: Install newt
        uses: ./.github/actions/newt-install
        with:
          artifact: newt
      - name: Set up project
        uses: ./.github/actions/newt-project
      - name: Build Blinky
        shell: bash
        run: |
             cd build
             bash ../.github/test_build_blinky.sh

  bootloader:
    name: Build bootloader
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install Dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib ccache
      - name: Restore project
        uses: ./.github/actions/newt-project-restore
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: bootloader-${{ matrix.shard }}
      - name: Build bootloader
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 2
        run: |
             cd build
             bash ../.github/test_build_bootloader.sh
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: bootloader-${{ matrix.shard }}

  apps:
    name: Build all apps
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install Dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib ccache
      - name: Restore project
        uses: ./.github/actions/newt-project-restore
      - name: Remove project targets
        shell: bash
        run: rm -rf build/targets
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: apps-${{ matrix.shard }}
      - name: Build applications
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 2
        run: |
             cd build
             bash ../.github/test_build_apps.sh
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: apps-${{ matrix.shard }}

  targets:
    name: Build all test targets
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Restore project
        uses: ./.github/actions/newt-project-restore
      - name: Remove project targets
        shell: bash
        run: rm -rf build/targets
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: targets
      - name: Build targets
        shell: bash
        run: |
             cp -r .github/targets build/targets
             cd build
             ls targets | xargs -n1 sh -c 'echo "Testing $0"; newt build -q $0'
             rm -rf targets
      - name: Build Linux-only targets
        shell: bash
        run: |
             cp -r .github/targets_linux build/targets
             cd build
             ls targets | xargs -n1 sh -c 'echo "Testing $0"; newt build -q  $0'
             rm -rf targets
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: targets

  targets-other-os:
    name: Build all test targets
    needs: newt
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install GNU sed
        if: matrix.os == 'macos-latest'
        run: |
             brew install gnu-sed
             echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
      - name: Install newt
        uses: ./.github/actions/newt-install
        with:
          artifact: newt
      - name: Set up project
        uses: ./.github/actions/newt-project
      - name: Remove project targets
        shell: bash
        run: rm -rf build/targets
      - name: Build targets
        shell: bash
        run: |
             cp -r .github/targets build/targets
             cd build
             ls targets | xargs -n1 sh -c 'echo "Testing $0"; newt build -q $0'
             rm -rf targets

  mtest-apps:
    name: Build mtest apps
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: 15.2.Rel1
      - name: Install Dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib ccache
      - name: Restore project
        uses: ./.github/actions/newt-project-restore
      - name: Remove project targets
        shell: bash
        run: rm -rf build/targets
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: mtest-apps
      - name: Build mtest apps
        shell: bash
        run: |
             cd build
             bash ../.github/test_build_mtest_apps.sh
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: mtest-apps

  gcc-target:
    name: Build GCC test target
    needs: prepare
    strategy:
      fail-fast: false
      # Limit number of parallel jobs, ASF policy limits job concurrency
      # level per workflow
      max-parallel: 2
      matrix:
        gcc: ['15.2.Rel1', '14.2.Rel1', '13.2.Rel1', '12.2.Rel1', '11.3.Rel1', '10.3-2021.10', '9-2020-q2', '8-2019-q3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: ${{ matrix.gcc }}
      - name: Restore project
        uses: ./.github/actions/newt-project-restore
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: gcc-target-${{ matrix.gcc }}
      - name: Build targets
        shell: bash
        run: |
             cd build
             newt build @apache-mynewt-core/targets/coverity/btshell_nrf52840_coverity
             newt build @apache-mynewt-core/targets/coverity/btshell_nrf52840_coverity2
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: gcc-target-${{ matrix.gcc }}

  unit-tests:
    name: Run unit tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib ccache
      - name: Restore project
        uses: ./.github/actions/newt-project-restore
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: unit-tests
      - name: Switch to main mcuboot
        # This is temporary until next mcuboot release is available
        shell: bash
        run: |
             cd build/repos/mcuboot
             git fetch origin main:main
             git checkout main
      - name: newt test all
        run: |
             cd build
             newt test all
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: unit-tests

  # Jobs save caches with unique keys, remove entries superseded by
  # caches saved in this run. Separate job, so that only it has write
  # access to caches and none of jobs building code does.
  cache-cleanup:
    name: Remove superseded caches
    needs: [newt, prepare, blinky, bootloader, apps, targets, mtest-apps, gcc-target, unit-tests]
    if: >-
      !cancelled() && github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - name: Remove superseded caches
        uses: ./.github/actions/cache-cleanup
