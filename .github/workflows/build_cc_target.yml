name: GCC target

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    name: Build GCC test target
    strategy:
      fail-fast: false
      matrix:
        gcc: ['15.2.Rel1', '14.2.Rel1', '13.2.Rel1', '12.2.Rel1', '11.3.Rel1', '10.3-2021.10', '9-2020-q2', '8-2019-q3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: ${{ matrix.gcc }}
      - name: Install newt
        uses: ./.github/actions/newt-install
      - name: Set up project
        uses: ./.github/actions/newt-project
        with:
          project: .github/project_build_cc_target.yml
      - name: Build targets
        shell: bash
        run: |
             cd build
             newt build @apache-mynewt-core/targets/coverity/btshell_nrf52840_coverity
             newt build @apache-mynewt-core/targets/coverity/btshell_nrf52840_coverity2
