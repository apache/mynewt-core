name: Bootloader

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootloader:
    name: Build bootloader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install Dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib
      - name: Install newt
        uses: ./.github/actions/newt-install
      - name: Setup project
        shell: bash
        run: |
             newt new build
             cp -f .github/project.yml build/project.yml
             cd build
             newt upgrade --shallow=1
             git -C repos/apache-mynewt-core fetch origin $GITHUB_SHA
             sed -i "s/0.0.0/$GITHUB_SHA-commit/g" project.yml
             newt upgrade --shallow=1
             cd ..
      - name: Build bootloader
        shell: bash
        run: |
             cd build
             bash ../.github/test_build_bootloader.sh
