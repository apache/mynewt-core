pkg.name: mgmt/smp/transport/smp_udp
pkg.description: SMP transport over UDP (one SMP packet per datagram)
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "http://mynewt.apache.org/"
pkg.keywords:
    - smp
    - udp
    - mcumgr

pkg.deps:
    - "@apache-mynewt-core/kernel/os"
    - "@apache-mynewt-core/mgmt/smp"
    - "@apache-mynewt-core/net/ip/mn_socket"

pkg.init:
    smp_udp_pkg_init: 'MYNEWT_VAL(SMP_UDP_SYSINIT_STAGE)'
