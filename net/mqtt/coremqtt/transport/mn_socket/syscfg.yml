syscfg.defs:
    COREMQTT_MN_SOCKET_RECV_TIMEOUT_MS:
        description: >
            Maximum time (in milliseconds) the transport receive function
            blocks waiting for data before reporting that nothing was
            received. This also bounds how long a single MQTT_ProcessLoop()
            call waits for an incoming packet. Can be changed per connection
            with mqtt_mn_socket_set_recv_timeout().
        value: 100
