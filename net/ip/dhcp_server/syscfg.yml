syscfg.defs:
    DHCP_SERVER_MAX_INSTANCES:
        description: >
            Number of network interfaces DHCP server can be started on.
        value: 1
        range: 1..8
    DHCP_SERVER_MAX_LEASES:
        description: >
            Maximum size of address pool of single server instance.
        value: 8
        range: 1..64

syscfg.restrictions:
    # lwIP accepts packets from 0.0.0.0 (DHCP DISCOVER) only with LWIP_DHCP
    - 'LWIP_DHCP'
