syscfg.defs:
    TINYCBOR_FLOAT_SUPPORT:
        description: >
            Enable support for encoding and decoding floating point values
            (float and double).
        value: 'MYNEWT_VAL_FLOAT_USER'
    TINYCBOR_HALF_FLOAT_SUPPORT:
        description: >
            Enable support for encoding and decoding half-precision floating
            point values.
        value: 0
        restrictions:
            - 'TINYCBOR_FLOAT_SUPPORT if 1'
    TINYCBOR_PARSER_MAX_RECURSIONS:
        description: >
            Maximum nesting level of containers supported by recursive parser
            functions (validation, pretty printing).
        value: 32
    TINYCBOR_PRETTY_API:
        description: >
            Enable API for converting CBOR to human readable diagnostic
            notation (cbor_value_to_pretty() and related functions).
        value: 1
    TINYCBOR_VALIDATION_API:
        description: >
            Enable API for validating CBOR stream (cbor_value_validate() and
            related functions).
        value: 1
