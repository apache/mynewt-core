pkg.name: encoding/tinycbor
pkg.description: CBOR encoding/decoding library (Intel TinyCBOR) with Mynewt extensions
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "https://github.com/intel/tinycbor"
pkg.keywords:
    - cbor
pkg.type: sdk

pkg.deps:
    - "@apache-mynewt-core/kernel/os"

pkg.cflags:
    - -DCBOR_EXTERNAL_CFG

pkg.include_dirs:
    - "include"
    - "@tinycbor/src"

pkg.source_files:
    - "@tinycbor/src/cborencoder.c"
    - "@tinycbor/src/cborencoder_close_container_checked.c"
    - "@tinycbor/src/cborerrorstrings.c"
    - "@tinycbor/src/cborparser.c"
    - "@tinycbor/src/cborparser_dup_string.c"
    - "src/cbor_cnt_writer.c"
    - "src/cbor_mbuf_reader.c"
    - "src/cbor_mbuf_writer.c"
    - "src/cbor_mynewt.c"
    - "src/cbor_reader.c"

pkg.source_files.TINYCBOR_HALF_FLOAT_SUPPORT:
    - "@tinycbor/src/cborencoder_float.c"
    - "@tinycbor/src/cborparser_float.c"

pkg.source_files.TINYCBOR_PRETTY_API:
    - "@tinycbor/src/cborpretty.c"
    - "@tinycbor/src/cborpretty_stdio.c"

pkg.source_files.TINYCBOR_VALIDATION_API:
    - "@tinycbor/src/cborvalidation.c"

# Pinned to commit past v7.0 to get 76d7a29 ("compilersupport: fix build
# with GCC < 11"). v7.0 uses [[fallthrough]] in C, which fails to build
# with GCC 8 and 9. Switch back to a release tag once one includes it.
repository.tinycbor:
    type: github
    vers: 76d7a29cead0f8c1c72a6b4fb2ecbc8a9885ed89-commit
    branch: main
    user: intel
    repo: tinycbor
