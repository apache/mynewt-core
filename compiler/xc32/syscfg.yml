syscfg.defs:
    XC32_DFP_FLAGS:
        description: >
            Additional XC32 options selecting the device family pack, e.g.
            "-mdfp=/opt/microchip/PIC32MZ-EF_DFP/1.6.179". Starting with
            XC32 v5.00 device support files are no longer included in the
            compiler and the DFP location must be passed to the compiler.
            The path is machine specific, so when this setting is empty
            newt uses the environment variable with the same name instead.
        value: ""
